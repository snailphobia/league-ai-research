name: Windows input and capture

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: python -m pytest -m 'not windows' -q
  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    env:
      LEAGUE_INPUT_NATIVE_TESTS: '1'
      LEAGUE_INPUT_EVIDENCE: artifacts/windows-input.json
      LEAGUE_CAPTURE_EVIDENCE: artifacts/capture
      LEAGUE_POLICY_EVIDENCE: artifacts/policy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q --junitxml=artifacts/windows-junit.xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-input-evidence
          path: |
            artifacts/windows-input.json
            artifacts/windows-junit.xml
            artifacts/capture/
            artifacts/policy/
